# Bun config for @joblify/web.
# https://bun.sh/docs/runtime/bunfig

[install]
# Never resolve to a release younger than 3 days (value is seconds). The window
# between a malicious publish and its takedown is where npm supply-chain worms
# (the Sep/Nov 2025 waves) do their damage; a job board loses nothing by being
# three days behind on patch releases. Raise it in an emergency, never lower it
# to "get the fix now" without reading the changelog.
minimumReleaseAge = 259200

[run]
# Use the system shell for npm scripts (`bun run dev` etc).
shell = "system"
