name: Deploy Preview (Vercel CLI)

# Vercel's native Git integration deploys automatically on every push/PR, but
# its checks have been failing since #45 with no detail beyond "Deployment
# has failed" — the dashboard for this project lives under a Vercel scope
# this environment can't reach, so there was no way to read the real build
# log. This workflow deploys the same commit through the Vercel CLI instead,
# authenticated with the VERCEL_TOKEN/VERCEL_ORG_ID/PROJECT_ID repo secrets,
# which puts the full build output (including `prisma migrate deploy`,
# apps/web/vercel.ts's buildCommand) into a readable GitHub Actions log.
#
# Preview only — never --prod. Deploys tied to the linked repo/commit still
# register as a normal GitHub deployment_status event, so the existing axe +
# Lighthouse gates in lighthouse.yml pick it up the same as a native deploy.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel preview deploy
    # Not run when the workflow has no access to the repo secrets. Dependabot
    # runs read the separate "Dependabot secrets" store and fork PRs get none,
    # so VERCEL_TOKEN is empty and `vercel pull` dies with "No existing
    # credentials found" - a red check on every dependency PR that says nothing
    # about the change. The native Vercel Git integration still deploys those
    # PRs, and the Lighthouse / axe / E2E gates run off its deployment_status.
    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Deliberately NOT scoped to apps/web: the project's rootDirectory setting
    # (fixed 2026-07-30 — it had drifted to a path from an unrelated project)
    # is what maps the checked-out repo root to the Next.js app now, exactly
    # as the native Git integration's own clone+cd does. Combining that with a
    # working-directory here doubles the path (apps/web/apps/web) and every
    # step fails at ENOENT before it reaches the real build.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # Repo secret is named PROJECT_ID; the Vercel CLI specifically looks
      # for VERCEL_PROJECT_ID.
      VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # One-time remediation, not a recurring pipeline step: the project's
      # dashboard has a Framework Preset / Build Command override left over
      # from something unrelated to this repo (evidence: a CLI build of this
      # exact commit ran `vite build` — there is no Vite anywhere in this
      # codebase). A dashboard override always wins over vercel.ts, so no
      # amount of repo-side change fixes this; it has to be corrected via the
      # Vercel API with the token that's already a repo secret. Runs only on
      # manual dispatch so routine PR runs don't re-PATCH project settings on
      # every push.
      - name: Fix misconfigured Framework Preset / Build Command override
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Current project settings:"
          curl -sS "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
          | jq '{framework, buildCommand, devCommand, installCommand, outputDirectory, rootDirectory}'

          echo "Correcting framework + clearing the buildCommand override so apps/web/vercel.ts is honored…"
          http_code=$(curl -sS -o /tmp/vercel-patch-response.json -w '%{http_code}' -X PATCH \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"framework":"nextjs","buildCommand":null}')
          echo "HTTP $http_code"
          jq '{framework, buildCommand, devCommand, installCommand, outputDirectory, rootDirectory}' /tmp/vercel-patch-response.json 2>/dev/null || cat /tmp/vercel-patch-response.json
          if [ "$http_code" -ge 300 ]; then
            echo "::error::Vercel API PATCH failed with HTTP $http_code — the token may lack project-write scope. See response body above."
            exit 1
          fi

      # The Vercel CLI runs with VERCEL_TOKEN in its environment, so it is the
      # one package in this workflow worth pinning hard: `@latest` meant a
      # compromised release would have executed with the token the moment it
      # was published. Bump deliberately (and review the changelog) instead.
      - name: Pull Vercel project settings + env (preview)
        run: bunx vercel@63.1.2 pull --yes --environment=preview

      # vercel.ts's buildCommand only runs `prisma migrate deploy` for the
      # production target (or when ALLOW_PREVIEW_MIGRATE=1 is set on a preview
      # that has its own database branch), so a PR build can no longer apply an
      # unreviewed migration to a shared database.
      - name: Build via Vercel (runs vercel.ts buildCommand)
        run: bunx vercel@63.1.2 build

      # --archive=tgz uploads the prebuilt output as one tarball instead of one
      # request per file. Without it each run uploads a few thousand files, and
      # the Hobby plan caps uploads at 5,000 per day ("Too many requests - try
      # again in 24 hours", code api-upload-free): a handful of PR pushes in a
      # day turned this check red for everyone until the window reset, which
      # said nothing about the change under test. The CLI suggests the flag
      # itself in that error.
      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(bunx vercel@63.1.2 deploy --prebuilt --archive=tgz)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Vercel preview deploy"
            if [ -n "${{ steps.deploy.outputs.url }}" ]; then
              echo "${{ steps.deploy.outputs.url }}"
            else
              echo "Deploy failed — see the build/deploy step logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
