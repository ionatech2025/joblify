name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: nothing here writes to the repo, so the GITHUB_TOKEN gets
# read-only contents and nothing else. (Without this block the token inherits
# the repository default, which is read/write on many orgs.)
permissions:
  contents: read

jobs:
  web:
    name: web (apps/web)
    # Pinned, not `ubuntu-latest`: GitHub moves that label to Ubuntu 26 from
    # 2026-10-19, which swaps the toolchain (glibc, OpenSSL, Chrome for the
    # Playwright/Lighthouse jobs) under a green pipeline with no commit to
    # blame. Move all workflows together, deliberately, once 26 has been tried.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      # CI uses placeholder env so Prisma + Next.js build can run without real
      # provisioned services. Real secrets live in Vercel Project Env.
      # The Clerk publishable key must be FORMAT-VALID (pk_test_<base64 of
      # "domain$">) — `next build` prerenders <ClerkProvider>, which decodes it.
      # A bare "pk_test_placeholder" fails the decoder and breaks the build.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/joblify?schema=public"
      DATABASE_URL_UNPOOLED: "postgresql://user:pass@localhost:5432/joblify?schema=public"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
      CLERK_SECRET_KEY: "sk_test_placeholderplaceholderplaceholder"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      # Third-party actions are pinned to full commit SHAs (a mutable tag such
      # as `@v4` can be repointed by whoever controls that repository — the
      # March 2025 tj-actions compromise worked exactly that way). Dependabot's
      # github-actions ecosystem bumps these and keeps the version comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Vitest 5 and file-type 22 need Node >= 22.12; the runner's default Node
      # is older. Bun runs the scripts, but the test runner and `next build`
      # execute under Node.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match `packageManager` in apps/web/package.json. `latest`
          # made every run depend on whatever Bun shipped that morning.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Blocks on high/critical advisories in what actually ships. Dev-only
      # tooling is reported (second step) but does not block: a vulnerable test
      # runner is not a production exposure.
      #
      # Two advisories are acknowledged, both build/CLI-time only (no request
      # path, no user-controlled input), and neither has a compatible fix yet:
      #   GHSA-vfj7-8cjw-p6xm  braces <= 3.0.3 — newest 3.x IS 3.0.3; only
      #                        reachable by glob patterns the developers write.
      #   GHSA-ggr8-5vv4-36mx  deepmerge-ts < 8 — pinned exactly by
      #                        @prisma/config@6; clears with the Prisma 7 move.
      # Review when either package ships a fix; do not add to this list casually.
      - name: Dependency audit (production, blocking)
        run: |
          bun audit --prod --audit-level=high \
            --ignore GHSA-vfj7-8cjw-p6xm \
            --ignore GHSA-ggr8-5vv4-36mx

      - name: Dependency audit (all, advisory)
        continue-on-error: true
        run: bun audit --audit-level=moderate

      - name: Prisma validate
        run: bunx prisma validate

      - name: Prisma generate
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Coverage-gated: vitest.config.ts carries a floor that ratchets, so a
      # change that deletes tests fails here rather than in review. Same tests
      # as `bun run test`, plus instrumentation.
      - name: Unit tests
        run: bun run test:coverage

      - name: Build
        run: bun run build

      # Payload gate for the routes Lighthouse cannot reach. LHCI runs against
      # the preview deployment with no session, so it only ever measures public
      # pages; this reads the build output, so it covers /onboarding,
      # /employer-setup and the whole /jobseeker console too. Ceilings live in
      # the script.
      - name: First-load JS budget
        run: bun run perf:budget

  # Accessibility is gated on the real preview deploy (live services, real
  # URLs — a CI-spun server here has no DB/Clerk). Two blocking checks in
  # .github/workflows/lighthouse.yml:
  #   - `axe` job: tests/e2e/a11y.spec.ts across the public page set;
  #     critical/serious violations FAIL the check.
  #   - Lighthouse CI: the accessibility category asserts `error` at 0.90
  #     (ratchet to 0.95 as the remaining polish items land); other categories
  #     stay warn until their own gaps close.
  # Authenticated surfaces are wired in the same workflow and gated on secrets:
  #   - the `axe` job's a11y scans for /company/* and /jobseeker/*
  #   - the `e2e` job: console-design + authenticated + workflows specs
  # Both self-skip (green, with a ::warning:: saying so) until E2E_TEST_PASSWORD,
  # E2E_TEST_EMAIL_JOBSEEKER, E2E_TEST_EMAIL_COMPANY, CLERK_SECRET_KEY,
  # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY and E2E_DATABASE_URL(_UNPOOLED) exist as
  # repo secrets. Until then they measure nothing — see REMAINING_STEPS.md.

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
