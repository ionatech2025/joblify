name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      # CI uses placeholder env so Prisma + Next.js build can run without real
      # provisioned services. Real secrets live in Vercel Project Env.
      # The Clerk publishable key must be FORMAT-VALID (pk_test_<base64 of
      # "domain$">) — `next build` prerenders <ClerkProvider>, which decodes it.
      # A bare "pk_test_placeholder" fails the decoder and breaks the build.
      DATABASE_URL: 'postgresql://user:pass@localhost:5432/joblify?schema=public'
      DATABASE_URL_UNPOOLED: 'postgresql://user:pass@localhost:5432/joblify?schema=public'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k'
      CLERK_SECRET_KEY: 'sk_test_placeholderplaceholderplaceholder'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Prisma validate
        run: bunx prisma validate

      - name: Prisma generate
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      # Payload gate for the routes Lighthouse cannot reach. LHCI runs against
      # the preview deployment with no session, so it only ever measures public
      # pages; this reads the build output, so it covers /onboarding,
      # /employer-setup and the whole /jobseeker console too. Ceilings live in
      # the script.
      - name: First-load JS budget
        run: bun run perf:budget

  # Accessibility is gated on the real preview deploy (live services, real
  # URLs — a CI-spun server here has no DB/Clerk). Two blocking checks in
  # .github/workflows/lighthouse.yml:
  #   - `axe` job: tests/e2e/a11y.spec.ts across the public page set;
  #     critical/serious violations FAIL the check.
  #   - Lighthouse CI: the accessibility category asserts `error` at 0.90
  #     (ratchet to 0.95 as the remaining polish items land); other categories
  #     stay warn until their own gaps close.
  # Authenticated surfaces are wired in the same workflow and gated on secrets:
  #   - the `axe` job's a11y scans for /company/* and /jobseeker/*
  #   - the `e2e` job: console-design + authenticated + workflows specs
  # Both self-skip (green, with a ::warning:: saying so) until E2E_TEST_PASSWORD,
  # E2E_TEST_EMAIL_JOBSEEKER, E2E_TEST_EMAIL_COMPANY, CLERK_SECRET_KEY,
  # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY and E2E_DATABASE_URL(_UNPOOLED) exist as
  # repo secrets. Until then they measure nothing — see REMAINING_STEPS.md.

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
